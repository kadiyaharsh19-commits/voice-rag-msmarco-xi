name: Index MSMARCO-XI in Pinecone

on:
  workflow_dispatch:
    inputs:
      language:
        description: Hugging Face language config, for example hi or ta
        required: true
        default: hi
      limit:
        description: Number of dataset rows to index; 0 means all
        required: true
        default: '10000'

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Stream MSMARCO-XI into Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: voicerag-index
          PINECONE_NAMESPACE: ''
          HF_DATASET_CONFIG: ${{ inputs.language }}
          HF_DATASET_SPLIT: train
          HF_DATASET_LIMIT: ${{ inputs.limit }}
        run: python scripts/index_to_pinecone.py
